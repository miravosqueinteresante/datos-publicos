name: Actualizar Itaipú
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m unittest connectors.itaipu.tests.test_extractor connectors.itaipu.tests.test_connector
      - run: python connectors/itaipu/run.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet www/datos/itaipu-indicadores.json; then
            echo "Sin cambios."
          else
            git add www/datos/itaipu-indicadores.json
            git commit -m "datos itaipu $(date +%Y-%m-%d) [skip ci]"
            git push origin main
          fi
