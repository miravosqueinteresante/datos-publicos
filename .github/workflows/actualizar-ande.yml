name: actualizar-ande

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"   # mensual, día 1 a las 06:00 UTC

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Ejecutar conector ANDE
        run: python -m connectors.ande.run
      - name: Commitear y pushear si hay cambios
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require("child_process");
            const changed = execSync("git status --porcelain").toString().trim();
            if (!changed) {
              console.log("Sin cambios en los datos de ANDE.");
            } else {
              execSync('git config user.name "github-actions[bot]"');
              execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');
              execSync("git add www/datos/ande-indicadores.json");
              execSync('git commit -m "data(ande): actualizar indicadores desde conector"');
              execSync("git push");
            }
