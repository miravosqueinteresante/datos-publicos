name: Actualizar ANDE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pdfplumber

      - name: Ejecutar conector ANDE
        run: python connectors/ande/run.py

      - name: Verificar cambios en datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet www/datos/ande-indicadores.json; then
            echo "Sin cambios en datos."
          else
            echo "Datos actualizados. Haciendo commit..."
            git add www/datos/ande-indicadores.json
            git commit -m "datos ANDE actualizados $(date +%Y-%m-%d)"
          fi

      - name: Desplegar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www