name: Actualizar ANDE

on:
  schedule:
    - cron: "0 5 1 * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pdfplumber

      - name: Ejecutar tests
        run: python -m unittest connectors.ande.tests.test_curados connectors.ande.tests.test_extractor connectors.ande.tests.test_connector connectors.ande.tests.test_extractor_pdf connectors.ande.tests.test_normalizer connectors.ande.tests.test_validators connectors.ande.tests.test_connector_pdf

      - name: Ejecutar conector ANDE
        run: python connectors/ande/run.py

      - name: Verificar cambios en datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet www/datos/ande-indicadores.json 2>/dev/null; then
            echo "Sin cambios en datos."
          else
            echo "Datos actualizados. Haciendo commit y push..."
            git add www/datos/ande-indicadores.json www/datos/ande-indicadores-mvp.json 2>/dev/null || git add www/datos/ande-indicadores.json
            git commit -m "datos actualizados $(date +%Y-%m-%d) [skip ci]" || echo "nada para commitear"
            git push origin main || echo "push sin cambios"
          fi